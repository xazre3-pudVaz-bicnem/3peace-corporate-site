name: 毎日のブログ自動投稿

# 毎日 12:10（日本時間）に記事を1本生成し、content/blog へコミットします。
# GitHub Actions の cron は UTC のため 03:10 UTC を指定しています。
#
# 必要な Secret は ANTHROPIC_API_KEY のみです。
# （Settings → Secrets and variables → Actions → New repository secret）
#
# モデルを変えたい場合は Variables に ANTHROPIC_MODEL を追加してください。
# 未設定ならコスト重視で claude-haiku-4-5-20251001 を使います。

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

# 同じ日に二重実行されても記事が重複しないよう、並行実行させない
concurrency:
  group: daily-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          # rebase してから push するため履歴を全部取得する
          fetch-depth: 0

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 記事を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: npm run blog:generate

      - name: 変更をコミットしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/blog

          if git diff --cached --quiet; then
            echo "新しい記事はありません。コミットせずに終了します。"
            exit 0
          fi

          ADDED=$(git diff --cached --name-only --diff-filter=A | tr '\n' ' ')
          echo "追加されたファイル: ${ADDED}"

          git commit -m "ブログ記事を自動投稿: ${ADDED}"

          # 生成中に main が進んでいた場合に備えて rebase してから push
          git pull --rebase origin main
          git push origin HEAD:main
          echo "push しました。"
